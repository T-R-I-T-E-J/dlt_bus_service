# DLT · deploy/nginx-dlt.conf — reverse proxy + TLS termination + static host.
#
# WHY SAME-ORIGIN, NOT TWO DOMAINS: the backend has no CORS middleware
# (documented gap M-2, backend/SECURITY_FINDINGS.md) — a deliberate choice,
# not an oversight, because same-origin needs none and a hastily-added `*`
# CORS with credentials would be a real vulnerability. This config keeps the
# frontend's static .dc.html files and the API on ONE origin (one domain,
# one port from the browser's perspective) — exactly devserve.mjs's
# same-origin + /api proxy architecture, in production, in front of a real
# TLS certificate. If the frontend and API ever need separate domains,
# CORS must be built deliberately first — do not point this config's
# server_name at two different domains and expect it to work.
#
# TLS: obtain a real certificate for the real domain before using this
# (e.g. certbot / Let's Encrypt) — CHANGE the ssl_certificate paths below.
# Nothing here has been installed, started, or pointed at a real domain.
#
# Cookies: auth.routes.ts hardcodes `secure: true` on the session cookie
# (not gated on NODE_ENV) — it will silently fail to be SET on any
# non-localhost origin served over plain HTTP. HTTPS here is not optional
# hardening, it is required for sign-in to work at all once this is behind
# a real domain.

# ---- plain HTTP: redirect to HTTPS only ----
server {
    listen 80;
    listen [::]:80;
    server_name dlt.example.com;   # CHANGE to the real domain

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: static files + /api proxy, one origin ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dlt.example.com;   # CHANGE to the real domain

    ssl_certificate     /etc/letsencrypt/live/dlt.example.com/fullchain.pem;  # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/dlt.example.com/privkey.pem;    # CHANGE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # helmet() already sets HSTS, X-Content-Type-Options, etc. on API
    # responses — this repeats the essentials for the STATIC files nginx
    # serves directly, which never touch the Node process.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # CHANGE: absolute path to the repo root on this host — the directory
    # containing the *.dc.html files, dlt-client.js, journey.js, assets/.
    #
    # THIS IS THE FULL PROJECT CHECKOUT, backend/ included. Nothing here
    # copies a curated frontend-only directory into place — there is no
    # build step (see PRODUCTION_DEPLOYMENT.md), so `root` points straight
    # at the repo. Without the deny rules below, `try_files` would happily
    # serve backend/.env (real Gmail/Razorpay/DB credentials), the full
    # backend/src TypeScript source, backend/migrations/*.sql (the entire
    # schema), and every internal audit/spec .md and .dc.html document in
    # this repo to anyone who requested the path. Found and closed during
    # the production-completeness audit — this is not defense-in-depth for
    # a hypothetical, it is the only thing standing between this config,
    # used exactly as written, and a public credentials leak.
    root /opt/dlt;
    index "DLT Homepage.dc.html";

    # Never serve the backend source tree, dotfiles, internal engineering
    # docs, or the standalone test harness as static files. Must come
    # before the general static location.
    location ~ ^/(backend|test|uploads)(/|$) { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }  # .env, .git, etc.
    location ~ \.(md|sql)$  { deny all; return 404; }
    location ~ ^/(DLT (Readiness|Second) Audit\.dc\.html|DLT Final Verification\.dc\.html|store-tests\.html)$ { deny all; return 404; }

    # The API. Must come before the general static location so /api/*
    # never falls through to the file-not-found static handler.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # req.ip must be the real client IP for rate limiting and audit
        # logs to mean anything — app.ts already sets `trust proxy: 1`,
        # which trusts exactly ONE hop of X-Forwarded-For. This nginx is
        # that one hop; do not chain a second proxy in front of this one
        # without changing the trust-proxy count to match, or a client
        # could spoof X-Forwarded-For and forge their own rate-limit key.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Cookies, SSE-free JSON API — no special buffering needs beyond
        # nginx's defaults. Body size matches the app's own 64kb JSON limit
        # (bookings.routes.ts) with headroom; nothing here needs to be huge.
        client_max_body_size 256k;
    }

    # Long-lived static assets — the coach model and vendored libraries
    # never change without a new filename or a deploy, so cache them hard.
    location ~* \.(glb|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # A branded 404 instead of nginx's bare default page. 404.html is a
    # plain static file (no dependency on support.js), so it renders even
    # if the app's JS never loads.
    error_page 404 /404.html;
    location = /404.html { internal; }
}
