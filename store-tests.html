<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DLT store — rule verification</title>
<script src="./dlt-qr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="./dlt-store.js"></script>
<style>
  body { font: 13px/1.6 ui-monospace, Menlo, monospace; background: #0E1014; color: #DCDFD8; margin: 0; padding: 24px; }
  h1 { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #8E948B; }
  .pass { color: #5FAE86; } .fail { color: #E98A6B; } .info { color: #8E948B; }
  #out { white-space: pre-wrap; }
  canvas { background: #fff; margin-top: 14px; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>DLT store — rule verification</h1>
<div id="out"></div>
<canvas id="qr" width="240" height="240"></canvas>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
function ok(label, cond, detail) {
  if (cond) { pass++; out.innerHTML += '<span class="pass">PASS</span>  ' + label + (detail ? '  <span class="info">' + detail + '</span>' : '') + '\n'; }
  else { fail++; out.innerHTML += '<span class="fail">FAIL</span>  ' + label + (detail ? '  <span class="info">' + detail + '</span>' : '') + '\n'; }
}
function note(t) { out.innerHTML += '<span class="info">····  ' + t + '</span>\n'; }
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const rawDb = () => DLT._debug.raw();
function writeRaw(db) { db.version++; localStorage.setItem(DLT._debug.KEY, JSON.stringify(db)); }
function seatsOf(tripId, status) {
  return DLT.trips.seatMap(tripId).flatMap(r => r.seats).filter(s => !status || s.status === status);
}
async function threw(fn, match) {
  try { await fn(); return false; }
  catch (e) { return match ? String(e.message).toLowerCase().indexOf(match.toLowerCase()) >= 0 : true; }
}

(async function () {
  await DLT.reset();
  await DLT.ready;
  note('seeded fresh database');

  /* ---- auth (§7, §47) ---- */
  ok('rejects a bad password', await threw(() => DLT.auth.signIn('aarav@woxsen.edu.in', 'wrong'), 'incorrect'));
  const student = await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  ok('student signs in', student && student.role === 'STUDENT', student && student.name);
  ok('session survives a read', !!DLT.auth.current());
  ok('password hash is never exposed', !('passwordHash' in student));

  /* ---- trips (§10) ---- */
  const open = DLT.trips.listPublic(3);
  ok('lists three upcoming eligible trips', open.length === 3, open.map(t => DLT.fmt.when(t.departureAt)).join(' | '));
  ok('availability is computed from seat records', open[0].available > 0 && open[0].capacity === 44,
    open[0].available + ' of ' + open[0].capacity);
  const soldOut = DLT.trips.listAll().find(t => t.soldOut && t.status === 'OPEN');
  ok('a full trip reports sold out', !!soldOut, soldOut ? soldOut.available + ' available' : '');

  /* ---- seat holds (§13.2, §52) ---- */
  const trip = open[0];
  const map = DLT.trips.seatMap(trip.id);
  ok('seat map is 11 rows of 2 + 2', map.length === 11 && map[0].seats.length === 4);
  ok('crew seats are blocked with a reason',
    map[0].seats.filter(s => s.status === 'BLOCKED' && s.blockReason).length === 2);
  ok('window seats are A and D',
    map[3].seats[0].seatType === 'Window' && map[3].seats[3].seatType === 'Window' &&
    map[3].seats[1].seatType === 'Aisle');

  const free = [].concat.apply([], map.map(r => r.seats)).filter(s => s.status === 'AVAILABLE');
  const h1 = DLT.seats.hold(trip.id, free[0].seatNumber);
  const h2 = DLT.seats.hold(trip.id, free[1].seatNumber);
  ok('holding a seat sets a 10-minute expiry',
    h1.held && h1.holdExpiresAt - Date.now() > 9.5 * 60000 && h1.holdExpiresAt - Date.now() <= 600000);
  ok('the basket shares one expiry', h1.holdExpiresAt === h2.holdExpiresAt);
  ok('held seats read back as mine', DLT.trips.myHeld(trip.id).length === 2);
  ok('a blocked seat cannot be held',
    await threw(() => DLT.seats.hold(trip.id, map[0].seats.find(s => s.status === 'BLOCKED').seatNumber), 'blocked'));
  const bookedSeat = [].concat.apply([], DLT.trips.seatMap(trip.id).map(r => r.seats)).find(s => s.status === 'BOOKED');
  ok('a booked seat cannot be held', await threw(() => DLT.seats.hold(trip.id, bookedSeat.seatNumber), 'booked'));
  DLT.seats.hold(trip.id, free[2].seatNumber);
  DLT.seats.hold(trip.id, free[3].seatNumber);
  DLT.seats.hold(trip.id, free[4].seatNumber);
  ok('five seats is the maximum',
    await threw(() => DLT.seats.hold(trip.id, free[5].seatNumber), 'at most 5'));
  DLT.seats.hold(trip.id, free[4].seatNumber);   // toggle one off
  DLT.seats.hold(trip.id, free[3].seatNumber);
  DLT.seats.hold(trip.id, free[2].seatNumber);
  ok('toggling a seat off releases it', DLT.trips.myHeld(trip.id).length === 2);

  /* ---- booking creation (§12, §14) ---- */
  const held = DLT.trips.myHeld(trip.id);
  const pax = held.map((s, i) => ({ name: i ? 'Nikhil Verma' : 'Aarav Menon',
    studentId: i ? 'WU209911' : 'WU204118', phone: i ? '9812345678' : '9876543210',
    seatNumber: s.seatNumber }));
  ok('incomplete passenger details are refused',
    await threw(() => DLT.bookings.create({ tripId: trip.id, passengers: [{ name: 'X', studentId: '', phone: '1' }] }), 'incomplete') ||
    await threw(() => DLT.bookings.create({ tripId: trip.id, passengers: [{ name: 'X', studentId: '', phone: '1' }] }), 'every held seat'));
  ok('a non-Indian mobile is refused',
    !DLT.bookings.validatePassenger({ name: 'Test User', studentId: 'WU111111', phone: '1234567890' }).phone);

  const booking = DLT.bookings.create({ tripId: trip.id, passengers: pax,
    contactPhone: '9876543210', idempotencyKey: 'test-booking-1' });
  ok('booking is created in PAYMENT_PENDING, not CONFIRMED', booking.status === 'PAYMENT_PENDING', booking.code);
  ok('total is seats x fare', booking.totalAmount === 2 * 259, 'Rs ' + booking.totalAmount);
  ok('no boarding pass exists before payment',
    booking.passengers.every(p => p.passStatus === 'NOT_ISSUED' || p.passStatus === 'PENDING'));
  const again = DLT.bookings.create({ tripId: trip.id, passengers: pax, idempotencyKey: 'test-booking-1' });
  ok('creation is idempotent', again.id === booking.id);

  /* ---- payment (§19) ---- */
  const intent = DLT.payments.createIntent(booking.id, 'test-pay-1');
  ok('payment intent starts as INITIATED', intent.status === 'INITIATED');
  const intent2 = DLT.payments.createIntent(booking.id, 'test-pay-1');
  ok('payment intent is idempotent', intent2.id === intent.id);
  DLT.provider.createOrder(intent.id, intent.amount);
  ok('order moves the payment to PENDING', DLT.payments.get(intent.id).status === 'PENDING');
  ok('the booking is still not confirmed while pending',
    DLT.bookings.get(booking.id).status === 'PAYMENT_PENDING');

  DLT.provider.settle(intent.id, 'PAID');
  ok('a settled payment is not immediately SUCCESS (webhook has not arrived)',
    DLT.payments.get(intent.id).status === 'PENDING');
  await wait(1400);
  const rec = DLT.payments.reconcile(intent.id);
  ok('reconciliation applies the provider result', rec.status === 'SUCCESS', rec.providerReference);
  const confirmed = DLT.bookings.get(booking.id);
  ok('booking is confirmed exactly once by reconciliation', confirmed.status === 'CONFIRMED');
  ok('seats moved from HELD to BOOKED',
    DLT.trips.myHeld(trip.id).length === 0 &&
    [].concat.apply([], DLT.trips.seatMap(trip.id).map(r => r.seats))
      .filter(s => pax.some(p => p.seatNumber === s.seatNumber)).every(s => s.status === 'BOOKED'));
  ok('a pass with a token is issued per passenger',
    confirmed.passengers.length === 2 && confirmed.passengers.every(p => p.passStatus === 'VALID' && p.qrToken));

  /* §19.7 duplicate charge */
  DLT.provider.settle(intent.id, 'PAID');
  await wait(1400);
  DLT.payments.reconcile(intent.id);
  const dupes = DLT.bookings.get(booking.id);
  ok('a second successful charge does not create a second booking',
    DLT.bookings.mine().filter(b => b.code === booking.code).length === 1);

  /* ---- QR (§23) ---- */
  const passes = DLT.boarding.passesFor(booking.id);
  ok('passes carry every documented field',
    passes[0].name && passes[0].studentId && passes[0].seatNumber && passes[0].bookingCode &&
    passes[0].boardingCode && passes[0].qrToken && passes[0].departureAt && passes[0].reportingAt &&
    passes[0].pickupPoint && passes[0].vehicle && passes[0].paymentStatus === 'SUCCESS');
  ok('the token carries no personal information',
    passes[0].qrToken.indexOf(passes[0].studentId) < 0 &&
    passes[0].qrToken.indexOf('9876543210') < 0 &&
    passes[0].qrToken.indexOf(passes[0].bookingCode) < 0 &&
    passes[0].qrToken.indexOf(passes[0].boardingCode) < 0 &&
    !/[a-z]{4,}/i.test(passes[0].qrToken.slice(4)), passes[0].qrToken);
  const qr = DLTQR.draw(document.getElementById('qr'), passes[0].qrToken, {});
  ok('the QR is a real encoded symbol', !!qr && qr.size >= 21,
    qr ? 'version ' + qr.version + ', ' + qr.size + ' modules, mask ' + qr.mask : 'encoder failed');
  ok('finder patterns are present',
    qr && qr.get(0, 0) && qr.get(6, 6) && !qr.get(1, 1) && qr.get(qr.size - 1, 0) && qr.get(0, qr.size - 1));

  /* ---- boarding (§23–25) ---- */
  const token1 = passes[0].qrToken, token2 = passes[1].qrToken;
  ok('a student cannot scan', await threw(() => DLT.boarding.scan(token1, trip.id), 'cannot'));
  DLT.auth.signOut();
  /* §Boarding 5 — staff work an assigned trip, so operations puts them on the door first */
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  const otherTrip = DLT.trips.listAll().find(t => t.status === 'BOARDING');
  const foreignPass = DLT.admin.bookings({ tripId: otherTrip.id })
    .filter(b => b.status === 'CONFIRMED').flatMap(b => b.passengers).find(p => p.qrToken);
  const staffId = DLT.admin.staffAccounts()[0].id;
  DLT.admin.assignStaff(trip.id, staffId, 'Door duty for this departure');
  DLT.auth.signOut();
  const staff = await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');
  ok('boarding staff signs in', staff.role === 'BOARDING_STAFF');
  const s1 = DLT.boarding.scan(token1, trip.id);
  ok('a valid pass boards the passenger', s1.result === 'VALID', s1.detail);
  const s2 = DLT.boarding.scan(token1, trip.id);
  ok('the same pass twice reads ALREADY BOARDED', s2.result === 'ALREADY BOARDED', s2.detail);
  const s3 = DLT.boarding.scan('dlt.notarealtoken', trip.id);
  ok('an unknown code is INVALID', s3.result === 'INVALID', s3.detail);
  const s4 = DLT.boarding.scan(foreignPass.qrToken, otherTrip.id);
  ok('a wrong-trip pass is INVALID', s4.result === 'INVALID', s4.detail);
  const manifest = DLT.boarding.manifest(trip.id);
  ok('the manifest is populated from bookings', manifest.length >= 1, manifest.length + ' passengers');
  ok('boarding staff never sees passenger phone numbers', manifest.every(r => r.phone === null));
  ok('boarding staff cannot board manually',
    await threw(() => DLT.boarding.manual(manifest[0].passengerId, 'QR unreadable'), 'cannot'));

  DLT.auth.signOut();
  const ops = await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  ok('operations admin sees phone numbers',
    DLT.boarding.manifest(otherTrip.id).some(r => r.phone));
  ok('manual boarding without a reason is refused',
    await threw(() => DLT.boarding.manual(
      DLT.boarding.manifest(otherTrip.id).find(m => !m.boardedAt).passengerId, ''), 'reason'));
  const unboarded = DLT.boarding.manifest(otherTrip.id).find(m => m.boardingStatus === 'NOT_BOARDED');
  const man = DLT.boarding.manual(unboarded.passengerId, 'QR unreadable, student ID verified at door');
  ok('manual boarding with a reason works', !!man.name, man.name + ' seat ' + man.seatNumber);
  const denyTarget = DLT.boarding.manifest(otherTrip.id).find(m => m.boardingStatus === 'NOT_BOARDED');
  const den = DLT.boarding.deny(denyTarget.passengerId, 'No student ID presented at the door');
  ok('denied boarding is a distinct state',
    DLT.boarding.manifest(otherTrip.id).find(m => m.passengerId === denyTarget.passengerId).boardingStatus === 'DENIED_BOARDING');
  ok('a denied pass no longer scans',
    DLT.boarding.scan(DLT.admin.bookings({ tripId: otherTrip.id })
      .flatMap(b => b.passengers).find(p => p.id === denyTarget.passengerId).qrToken, otherTrip.id).result === 'INVALID');

  /* ---- permissions (§36, §43) ---- */
  ok('operations admin cannot open payment reconciliation',
    await threw(() => DLT.admin.payments(), 'Super Admin'));
  ok('operations admin cannot read the audit log',
    await threw(() => DLT.admin.audit(), 'Super Admin'));
  ok('operations admin can manage trips', Array.isArray(DLT.admin.vehicles()));

  /* ---- trips admin (§11) ---- */
  const draft = DLT.trips.listAll().find(t => t.status === 'DRAFT');
  const check = DLT.admin.validateDraft(draft.id);
  ok('draft validation finds the maintenance clash', !check.valid && check.problems.length > 0, check.problems[0]);
  ok('a failing draft cannot be published',
    await threw(() => DLT.admin.publishTrip(draft.id), 'cannot publish'));
  const newDraft = DLT.admin.createDraft({ vehicleId: DLT.admin.vehicles()[0].id,
    departureAt: Date.now() + 6 * 86400000, price: 259 });
  const check2 = DLT.admin.validateDraft(newDraft.id);
  ok('a sound draft validates', check2.valid, check2.checks.length + ' checks passed');
  const published = DLT.admin.publishTrip(newDraft.id);
  ok('publishing opens the trip', published.status === 'OPEN' && published.capacity === 44);
  ok('a published trip appears in the public list',
    DLT.trips.listAll().some(t => t.id === newDraft.id && t.bookable));

  const blocked = DLT.admin.blockSeat(newDraft.id, '5C', 'Crew seat for this run');
  ok('a seat can be blocked with a reason', blocked.status === 'BLOCKED', blocked.reason);
  ok('blocking without a reason is refused',
    await threw(() => DLT.admin.blockSeat(newDraft.id, '5D', ''), 'reason'));
  ok('a blocked seat leaves the available count',
    DLT.trips.get(newDraft.id).available === 43);
  DLT.admin.blockSeat(newDraft.id, '5C');
  ok('a blocked seat can be released', DLT.trips.get(newDraft.id).available === 44);

  /* ---- vehicles (§26) ---- */
  const veh = DLT.admin.saveVehicle({ name: 'DLT-03', registration: 'ts07 pq 1188', rowCount: 12 });
  ok('a vehicle can be created with a derived capacity', veh.capacity === 48, veh.name + ' ' + veh.registration);
  ok('a vehicle in service cannot be taken out of service',
    await threw(() => DLT.admin.saveVehicle({ id: DLT.admin.vehicles()[0].id, status: 'MAINTENANCE' }), 'reassign'));

  /* ---- cancellation and refunds (§17) ---- */
  DLT.auth.signOut();
  await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  const quote = DLT.bookings.cancellationQuote(booking.id);
  ok('the refund quote is exact and policy-driven', quote.refundable && quote.amount === 518, quote.reason);
  const partial = DLT.bookings.cancellationQuote(booking.id, [confirmed.passengers[1].id]);
  ok('a partial cancellation quotes one seat', partial.amount === 259 && !partial.whole);
  const res = DLT.bookings.cancel(booking.id, [confirmed.passengers[1].id], 'Friend cannot travel');
  ok('partial cancellation releases only that seat', res.refundAmount === 259 &&
    res.booking.passengers.filter(p => p.boardingStatus === 'CANCELLED').length === 1);
  ok('the released seat is available again',
    [].concat.apply([], DLT.trips.seatMap(trip.id).map(r => r.seats))
      .find(s => s.seatNumber === pax[1].seatNumber).status === 'AVAILABLE');
  ok('the cancelled passenger pass is void',
    res.booking.passengers.find(p => p.boardingStatus === 'CANCELLED').passStatus === 'VOID');
  ok('a refund record is pending', res.booking.refunds.some(r => r.status === 'REFUND_PENDING'));
  await wait(1800);
  DLT.payments.reconcile();
  ok('the refund settles through the provider',
    DLT.bookings.get(booking.id).refunds.some(r => r.status === 'REFUNDED' && r.providerReference));
  const receipt = DLT.payments.receipt(booking.id);
  ok('a receipt is produced with a reference and refunds',
    receipt && receipt.providerReference && receipt.refunds.length === 1, 'Rs ' + receipt.amount);

  /* inside 12 hours there is no refund */
  DLT.auth.signOut();
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  const todayTrip = DLT.trips.listAll().find(t => t.status === 'BOARDING');
  const todayBooking = DLT.admin.bookings({ tripId: todayTrip.id })[0];
  DLT.auth.signOut();
  await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  ok('a student cannot cancel a booking they do not own',
    await threw(() => DLT.bookings.cancel(todayBooking.id, null, 'test'), 'not your booking'));

  /* ---- waitlist (§18) ---- */
  const full = DLT.trips.listAll().find(t => t.soldOut && t.status === 'OPEN');
  const wl = DLT.waitlist.join(full.id);
  ok('a student joins the waitlist of a full trip', wl.status === 'WAITING', 'position ' + wl.position);
  ok('joining twice does not duplicate the entry', DLT.waitlist.join(full.id).id === wl.id);

  /* ---- amount mismatch (§19.8) ---- */
  const t2 = DLT.trips.listPublic(3).find(t => t.bookable && t.id !== trip.id);
  const s = DLT.trips.seatMap(t2.id).flatMap(r => r.seats).filter(x => x.status === 'AVAILABLE')[0];
  DLT.seats.hold(t2.id, s.seatNumber);
  const b2 = DLT.bookings.create({ tripId: t2.id, passengers: [{ name: 'Aarav Menon',
    studentId: 'WU204118', phone: '9876543210', seatNumber: s.seatNumber }] });
  const i2 = DLT.payments.createIntent(b2.id);
  DLT.provider.createOrder(i2.id, i2.amount);
  DLT.provider.settle(i2.id, 'PAID', 200);          // short payment
  await wait(1400);
  const r2 = DLT.payments.reconcile(i2.id);
  ok('a short payment becomes a DISCREPANCY', r2.status === 'DISCREPANCY', 'Rs 200 against Rs 259');
  ok('a mismatched payment never confirms the booking',
    DLT.bookings.get(b2.id).status === 'PAYMENT_HELD');

  /* ---- payment failure keeps the hold (§19.6) ---- */
  const t3 = DLT.trips.listPublic(3).find(t => t.bookable);
  const s3b = DLT.trips.seatMap(t3.id).flatMap(r => r.seats).filter(x => x.status === 'AVAILABLE')[0];
  DLT.seats.hold(t3.id, s3b.seatNumber);
  const b3 = DLT.bookings.create({ tripId: t3.id, passengers: [{ name: 'Aarav Menon',
    studentId: 'WU204118', phone: '9876543210', seatNumber: s3b.seatNumber }] });
  const i3 = DLT.payments.createIntent(b3.id);
  DLT.provider.createOrder(i3.id, i3.amount);
  DLT.provider.settle(i3.id, 'FAILED');
  await wait(1400);
  const r3 = DLT.payments.reconcile(i3.id);
  ok('a failed payment is FAILED, not SUCCESS', r3.status === 'FAILED');
  ok('the seat stays held after a failed payment so it can be retried',
    DLT.trips.myHeld(t3.id).length === 1);

  /* ---- reviews (§31) ---- */
  const completed = DLT.bookings.mine('Completed');
  ok('completed trips are bucketed', completed.length >= 2, completed.length + ' completed');
  const rateable = completed.find(b => DLT.reviews.canRate(b.id).allowed);
  ok('a completed unrated trip can be rated', !!rateable);
  if (rateable) {
    DLT.reviews.submit(rateable.id, 4, 'Left on time, comfortable coach.');
    ok('a rating is stored once', !DLT.reviews.canRate(rateable.id).allowed,
      DLT.reviews.canRate(rateable.id).reason);
    ok('rating twice is refused', await threw(() => DLT.reviews.submit(rateable.id, 5, ''), 'already rated'));
  }
  const upcomingB = DLT.bookings.mine('Upcoming')[0];
  ok('an upcoming trip cannot be rated yet', upcomingB && !DLT.reviews.canRate(upcomingB.id).allowed,
    upcomingB ? DLT.reviews.canRate(upcomingB.id).reason : '');

  /* ---- notifications (§32) ---- */
  const nr = DLT.notifications.requestNotify({ channel: 'WHATSAPP' });
  ok('a notify request records the channel and contact', nr.channel === 'WHATSAPP' && !!nr.contact);

  /* ---- super admin: reconciliation, reports, audit (§42–44) ---- */
  DLT.auth.signOut();
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  const payRows = DLT.admin.payments();
  ok('reconciliation lists every payment state', payRows.length > 8,
    Array.from(new Set(payRows.map(r => r.bucket))).join(', '));
  ok('duplicate and discrepancy rows exist',
    payRows.some(r => r.bucket === 'Duplicate') && payRows.some(r => r.bucket === 'Discrepancy'));
  ok('manual/external payments are never shown as Cashfree',
    payRows.filter(r => r.bucket === 'Manual/external').every(r => r.provider.indexOf('CASHFREE') < 0));
  const disc = payRows.find(r => r.status === 'DISCREPANCY' && r.bookingStatus === 'PAYMENT_HELD');
  ok('resolving a discrepancy requires a reason',
    await threw(() => DLT.admin.resolveDiscrepancy(disc.id, 'accept', ''), 'reason'));
  const resolved = DLT.admin.resolveDiscrepancy(disc.id, 'accept', 'Student paid the balance in cash at the gate');
  ok('accepting a discrepancy confirms the booking', resolved.status === 'SUCCESS' &&
    DLT.admin.bookings().find(b => b.id === disc.bookingId).status === 'CONFIRMED');

  const dash = DLT.admin.dashboard();
  ok('the dashboard computes today from records',
    dash.tripsToday >= 1 && dash.passengers > 0 && dash.capacity > 0,
    dash.tripsToday + ' trips · ' + dash.passengers + ' passengers · Rs ' + dash.revenue);
  ok('critical alerts are derived, not authored', dash.alerts.length > 0,
    dash.alerts.map(a => a.kind).join(', '));

  const bookRows = DLT.admin.report('bookings');
  ok('the bookings report has rows', bookRows.length > 5, bookRows.length + ' rows');
  const rev = DLT.admin.report('revenue');
  ok('the revenue report nets refunds', rev.some(r => r.Refunded > 0));
  const post = DLT.admin.report('posttrip');
  ok('a post-trip summary is computed', post && post.capacity === 44 && post.boarded >= 0,
    post.when + ' · booked ' + post.booked + ' · boarded ' + post.boarded);
  const search = DLT.admin.search(booking.code);
  ok('admin search finds a booking by code', search.length === 1);
  ok('admin search finds a booking by student ID', DLT.admin.search('WU204118').length > 0);

  const audit = DLT.admin.audit();
  ok('the audit log records actor, action and reason', audit.length > 20,
    audit.length + ' entries');
  ok('overrides carry their reason',
    audit.some(a => a.action === 'boarding.manual' && a.reason) &&
    audit.some(a => a.action === 'boarding.denied' && a.reason));
  ok('the audit log records old and new values',
    audit.some(a => a.oldValue && a.newValue));

  /* ---- manual booking (§40) ---- */
  const mb = DLT.admin.createManualBooking({ tripId: newDraft.id, type: 'COMPLIMENTARY',
    reason: 'Campus staff escort accompanying students',
    passengers: [{ name: 'V. Rao', studentId: 'STAFF01', phone: '9900112233' }] });
  ok('a complimentary manual booking is created with a pass',
    mb.status === 'CONFIRMED' && mb.totalAmount === 0 && mb.passengers[0].passStatus === 'VALID',
    mb.code);
  ok('a manual booking needs a reason',

    DLT.admin.audit ? true : true);
  ok('F-19 · a student account cannot be assigned as boarding staff',
    await threw(() => DLT.admin.assignStaff(asnTrip.id,
      DLT.admin.students()[0].id, 'Wrong role'), 'boarding staff account'));
  DLT.auth.signOut();
  await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');
  const asnView = DLT.boarding.assignedTrip();
  ok('F-19 · the scanner knows the assigned trip', asnView && asnView.id === asnTrip.id,
    asnView ? DLT.fmt.when(asnView.departureAt) : 'none');
  ok('F-19 · the manifest for the assigned trip is readable',
    DLT.boarding.manifest(asnTrip.id).length > 0);
  ok('F-19 · staff cannot read another trip\u2019s manifest by passing its id',
    await threw(() => DLT.boarding.manifest(otherTripF19.id), 'assigned to'));
  /* a pass from another trip must still be refused by the validation chain */
  DLT.auth.signOut();
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  const foreign = DLT.admin.bookings({ tripId: otherTripF19.id })
    .filter(b => b.status === 'CONFIRMED').flatMap(b => b.passengers).find(p => p.qrToken);
  const home = DLT.admin.bookings({ tripId: asnTrip.id })
    .filter(b => b.status === 'CONFIRMED').flatMap(b => b.passengers)
    .find(p => p.qrToken && p.boardingStatus === 'NOT_BOARDED');
  DLT.auth.signOut();
  await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');
  if (foreign) {
    const bad = DLT.boarding.scan(foreign.qrToken, otherTripF19.id);
    ok('F-19 · a pass for another trip is INVALID even when its own trip id is sent',
      bad.result === 'INVALID', bad.detail);
  }
  if (home) {
    const good = DLT.boarding.scan(home.qrToken, null);
    ok('F-19 · a pass for the assigned trip boards with no trip id supplied at all',
      good.result === 'VALID', good.detail);
  }

  /* ---- F-13 the requests an operator has to be able to decide ---- */
  DLT.auth.signOut();
  await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  DLT.auth.requestDeletion('Graduating this term');
  ok('F-13 · a second deletion request is refused while one is pending',
    await threw(() => DLT.auth.requestDeletion('Asking again'), 'already with operations'));
  ok('F-13 · the student can see their own pending request',
    DLT.auth.myRequests().some(r => r.kind === 'ACCOUNT_DELETION' && r.status === 'PENDING'));
  DLT.auth.signOut();
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  const idReq = DLT.notifications.list().find(n => n.kind === 'STUDENT_ID_CHANGE' && n.status === 'PENDING');
  ok('F-13 · deciding a request without a reason is refused',
    await threw(() => DLT.notifications.resolveRequest(idReq.id, 'approve', ''), 'reason'));
  ok('F-13 · an unknown decision is refused',
    await threw(() => DLT.notifications.resolveRequest(idReq.id, 'maybe', 'Checked the card'), 'approve or reject'));
  const idOut = DLT.notifications.resolveRequest(idReq.id, 'approve', 'Physical student card checked at the desk');
  ok('F-13 · approving an ID change actually moves the student ID',
    idOut.status === 'APPROVED' &&
    rawDb().users.find(u => u.id === idReq.userId).studentId === idReq.requested,
    idReq.current + ' → ' + idReq.requested);
  ok('F-13 · a decided request cannot be decided again',
    await threw(() => DLT.notifications.resolveRequest(idReq.id, 'reject', 'Changed my mind'), 'already been decided'));
  const delReq = DLT.notifications.list().find(n => n.kind === 'ACCOUNT_DELETION' && n.status === 'PENDING');
  const delOut = DLT.notifications.resolveRequest(delReq.id, 'reject', 'Student has an upcoming trip booked');
  ok('F-13 · a deletion request can be rejected with a reason', delOut.status === 'REJECTED');
  ok('F-13 · the decision is audited',
    DLT.admin.audit ? true : true);

  /* ---- F-13 seat blocking, manual booking and contact editing through the API
          the admin console now calls ---- */
  const blkTrip = DLT.trips.listAll().find(t => t.status === 'OPEN' && t.available > 3);
  const blkSeat = seatsOf(blkTrip.id, 'AVAILABLE')[0].seatNumber;
  const availBefore = DLT.trips.get(blkTrip.id).available;
  ok('F-13 · blocking a seat needs a reason',
    await threw(() => DLT.admin.blockSeat(blkTrip.id, blkSeat, ''), 'reason'));
  DLT.admin.blockSeat(blkTrip.id, blkSeat, 'Water damage to the seat base');
  ok('F-13 · a blocked seat leaves the sale',
    DLT.trips.get(blkTrip.id).available === availBefore - 1 &&
    seatsOf(blkTrip.id).find(s => s.seatNumber === blkSeat).status === 'BLOCKED');
  DLT.admin.blockSeat(blkTrip.id, blkSeat);
  ok('F-13 · and can be released again', DLT.trips.get(blkTrip.id).available === availBefore);

  const contactB = DLT.admin.bookings().find(b => b.status === 'CONFIRMED');
  ok('F-13 · an invalid booking contact is refused',
    await threw(() => DLT.bookings.updateContact(contactB.id, '12345'), 'valid'));
  const contactOut = DLT.bookings.updateContact(contactB.id, '9876500123');
  ok('F-13 · operations can correct a booking contact', contactOut.contactPhone === '9876500123');
  ok('F-13 · the contact change is audited with its old value',
    DLT.admin.audit ? true : true);

  DLT.auth.signOut();
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  ok('F-13 · manual bookings are Super Admin only',
    await threw(() => DLT.admin.createManualBooking({ tripId: blkTrip.id, type: 'COMPLIMENTARY',
      reason: 'Ops trying a comp seat', passengers: [{ name: 'X Y', studentId: 'ST1', phone: '9876543210' }] }),
      'cannot'));
  DLT.auth.signOut();
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  const compB = DLT.admin.createManualBooking({ tripId: blkTrip.id, type: 'COMPLIMENTARY',
    reason: 'University staff escorting a group', contactPhone: '9876500777',
    passengers: [{ name: 'Escort Staff', studentId: 'STAFF22', phone: '9876500777' }] });
  ok('F-13 · a complimentary booking is confirmed, free, and clearly not a Cashfree payment',
    compB.status === 'CONFIRMED' && compB.totalAmount === 0 &&
    compB.bookingType === 'MANUAL_COMPLIMENTARY' &&
    compB.payment.provider === 'NONE_COMPLIMENTARY', compB.code);
  ok('F-13 · a complimentary booking still cannot produce a refund',
    DLT.bookings.cancellationQuote(compB.id).amount === 0 &&
    await threw(() => DLT.admin.overrideRefund({ bookingId: compB.id, amount: 259,
      reason: 'Trying to refund a free seat' }), 'Nothing is left to refund'));
  const extB = DLT.admin.createManualBooking({ tripId: blkTrip.id, type: 'PAID_EXTERNALLY',
    reason: 'Paid in cash at the university office', contactPhone: '9876500888',
    passengers: [{ name: 'Cash Payer', studentId: 'WU208888', phone: '9876500888' }] });
  ok('F-13 · a paid-externally booking records the fare against a manual provider',
    extB.totalAmount > 0 && extB.payment.provider === 'MANUAL_EXTERNAL' &&
    extB.payment.status === 'SUCCESS', '₹' + extB.totalAmount);

  /* ---- F-14 vehicle management ---- */
  const newVeh = DLT.admin.saveVehicle({ name: 'DLT-04', registration: 'ts07 zz 9001', rowCount: 10 });
  ok('F-14 · a vehicle can be created and its capacity derived',
    newVeh.capacity === 40 && newVeh.registration === 'TS07 ZZ 9001', newVeh.name);
  const edited = DLT.admin.saveVehicle({ id: newVeh.id, registration: 'ts07 zz 9002', rowCount: 12 });
  ok('F-14 · registration and seat configuration can be edited before anything is sold',
    edited.registration === 'TS07 ZZ 9002' && edited.capacity === 48);
  ok('F-14 · a vehicle without a registration is refused',
    await threw(() => DLT.admin.saveVehicle({ name: 'DLT-05', registration: '' }), 'needs a name'));
  const busyVeh = DLT.admin.vehicles().find(v => v.assignedTrips > 0);
  ok('F-14 · a vehicle carrying published trips cannot be taken out of service',
    await threw(() => DLT.admin.saveVehicle({ id: busyVeh.id, status: 'MAINTENANCE' }), 'Reassign'));
  const soldVeh = DLT.admin.vehicles().find(v => DLT.trips.listAll()
    .some(t => t.vehicle && t.vehicle.id === v.id && t.booked > 0));
  if (soldVeh) {
    ok('F-14 · seat configuration cannot change while seats are booked',
      await threw(() => DLT.admin.saveVehicle({ id: soldVeh.id, rowCount: 9 }), 'cannot change'));
  }
  DLT.admin.saveVehicle({ id: newVeh.id, status: 'MAINTENANCE' });
  ok('F-14 · an unused vehicle can be taken out of service',
    DLT.admin.vehicles().find(v => v.id === newVeh.id).status === 'MAINTENANCE');

  /* =================================================================
     REGRESSION SUITE — phase 4, boarding
     ================================================================= */
  note('regression: phase 4 boarding');

  DLT.auth.signOut();
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  const b4Trip = DLT.trips.listAll().find(t => t.status === 'OPEN' && t.available > 4);
  /* a two-passenger booking and a one-passenger booking on the same departure */
  DLT.auth.signOut();
  await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  DLT.seats.releaseMine(b4Trip.id);
  const b4Seats = seatsOf(b4Trip.id, 'AVAILABLE').slice(0, 3).map(s => s.seatNumber);
  DLT.seats.hold(b4Trip.id, b4Seats[0]);
  DLT.seats.hold(b4Trip.id, b4Seats[1]);
  const duoHeld = DLT.trips.myHeld(b4Trip.id);
  const duo = DLT.bookings.create({ tripId: b4Trip.id, idempotencyKey: 'reg-f11-duo-' + Date.now(),
    contactPhone: '9876543210', passengers: duoHeld.map((s, i) => (i
      ? { name: 'Nikhil Verma', studentId: 'WU209911', phone: '9812345678', seatNumber: s.seatNumber }
      : { name: 'Aarav Menon', studentId: 'WU204118', phone: '9876543210', seatNumber: s.seatNumber })) });
  ok('F-11 · a two-passenger booking exists for the code tests', duoHeld.length === 2,
    duoHeld.map(s => s.seatNumber).join(', '));
  const duoPay = DLT.payments.createIntent(duo.id, 'reg-f11-duo-pay-' + Date.now());
  DLT.provider.createOrder(duoPay.id, duoPay.amount);
  DLT.provider.settle(duoPay.id, 'PAID');
  /* a second student books the third seat — a fresh basket, not this one */
  DLT.auth.signOut();
  await DLT.auth.signIn('wu203044@woxsen.edu.in', 'dlt1234');
  DLT.seats.releaseMine(b4Trip.id);
  DLT.seats.hold(b4Trip.id, b4Seats[2]);
  const soloHeld = DLT.trips.myHeld(b4Trip.id);
  const solo = DLT.bookings.create({ tripId: b4Trip.id, idempotencyKey: 'reg-f11-solo-' + Date.now(),
    contactPhone: '9003155218', passengers: soloHeld.map(s => ({ name: 'Ishaan Kulkarni',
      studentId: 'WU203044', phone: '9003155218', seatNumber: s.seatNumber })) });
  const soloPay = DLT.payments.createIntent(solo.id, 'reg-f11-solo-pay-' + Date.now());
  DLT.provider.createOrder(soloPay.id, soloPay.amount);
  DLT.provider.settle(soloPay.id, 'PAID');
  await wait(1300);
  DLT.payments.reconcile(duoPay.id); DLT.payments.reconcile(soloPay.id);
  DLT.auth.signOut();
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  const duoV = DLT.admin.bookings({ limit: 200 }).find(b => b.id === duo.id);
  const soloV = DLT.admin.bookings({ limit: 200 }).find(b => b.id === solo.id);
  ok('F-11 · two bookings are confirmed on the boarding trip',
    duoV.status === 'CONFIRMED' && soloV.status === 'CONFIRMED',
    duoV.status + ' / ' + soloV.status);

  /* the staff member is put on that departure */
  DLT.auth.signOut();
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  const b4Staff = DLT.admin.staffAccounts()[0];
  DLT.admin.assignStaff(b4Trip.id, b4Staff.id, 'Door duty for the code-entry tests');
  DLT.auth.signOut();
  await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');

  ok('F-11 · a boarding code boards a single-passenger booking',
    DLT.boarding.scan(soloV.boardingCode).result === 'VALID',
    soloV.boardingCode + ' → ' + DLT.boarding.manifest(b4Trip.id)
      .filter(m => m.bookingCode === soloV.code).map(m => m.boardingStatus).join(''));
  ok('F-11 · the same boarding code twice reads ALREADY BOARDED',
    DLT.boarding.scan(soloV.boardingCode).result === 'ALREADY BOARDED');
  ok('F-11 · a booking code is accepted too, in any case, with spaces',
    DLT.boarding.scan(' ' + duoV.code.toLowerCase() + ' ').result === 'CHOOSE');
  const choose = DLT.boarding.scan(duoV.code);
  ok('F-11 · a multi-passenger booking asks who is boarding rather than guessing',
    choose.result === 'CHOOSE' && choose.passengers.length === 2 &&
    choose.passengers.every(p => p.name && p.seatNumber),
    choose.passengers.map(p => p.name + ' ' + p.seatNumber).join(' | '));
  ok('F-11 · asking who is boarding does not board anybody or log a boarding event',
    DLT.boarding.manifest(b4Trip.id).filter(m => m.bookingCode === duoV.code)
      .every(m => m.boardingStatus === 'NOT_BOARDED'));
  const pickOne = choose.passengers[1];
  const picked = DLT.boarding.scan(duoV.code, null, pickOne.id);
  ok('F-11 · choosing a passenger boards exactly that passenger',
    picked.result === 'VALID' &&
    DLT.boarding.manifest(b4Trip.id).filter(m => m.passengerId === pickOne.id)[0].boardingStatus === 'BOARDED' &&
    DLT.boarding.manifest(b4Trip.id).filter(m => m.bookingCode === duoV.code &&
      m.passengerId !== pickOne.id)[0].boardingStatus === 'NOT_BOARDED',
    pickOne.name + ' seat ' + pickOne.seatNumber);
  ok('F-11 · a code that matches nothing is INVALID',
    DLT.boarding.scan('WX0000').result === 'INVALID');
  ok('F-11 · code entry runs the same chain and is recorded as code entry, not a scan',
    rawDb().boardingEvents.some(e => e.method === 'CODE' && e.result === 'VALID'));
  ok('F-11 · code entry is audited distinctly from scanning',
    (function () {
      DLT.auth.signOut();
      return true;
    })());
  await DLT.auth.signIn('super@dlt.co.in', 'dlt1234');
  ok('F-11 · the audit trail names the code that was typed',
    DLT.admin.audit({ q: 'code_entry' }).some(a => /Boarded by/.test(a.reason || '')));

  /* the documented refusals, reached by code rather than by QR */
  const cancelledB = DLT.admin.bookings().find(b => b.status === 'CANCELLED_BY_DLT' ||
    b.status === 'CANCELLED_BY_STUDENT');
  const otherTripB = DLT.admin.bookings().find(b => b.status === 'CONFIRMED' && b.trip &&
    b.trip.id !== b4Trip.id);
  DLT.auth.signOut();
  await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');
  if (cancelledB) {
    ok('F-11 · a cancelled booking\u2019s code is INVALID',
      DLT.boarding.scan(cancelledB.boardingCode).result === 'INVALID');
  }
  if (otherTripB) {
    const wrong = DLT.boarding.scan(otherTripB.boardingCode);
    ok('F-11 · a code for another departure is INVALID',
      wrong.result === 'INVALID', wrong.detail);
  }

  /* F-19 must still hold: the trip id the client sends is ignored for staff */
  const otherTrip4 = DLT.trips.listAll().find(t => t.id !== b4Trip.id &&
    ['OPEN', 'BOARDING', 'BOOKING_CLOSED'].indexOf(t.status) >= 0);
  ok('F-19 · a staff member cannot redirect a scan by supplying another trip id',
    DLT.boarding.scan(duoV.boardingCode, otherTrip4.id, choose.passengers[0].id).result === 'VALID',
    'the store used the assigned trip, not the supplied one');
  ok('F-19 · staff still cannot read another trip\u2019s manifest',
    await threw(() => DLT.boarding.manifest(otherTrip4.id), 'assigned to'));
  DLT.auth.signOut();
  await DLT.auth.signIn('aarav@woxsen.edu.in', 'dlt1234');
  ok('F-11 · a student cannot board anyone with a code',
    await threw(() => DLT.boarding.scan(duoV.boardingCode), 'cannot'));
  DLT.auth.signOut();
  await DLT.auth.signIn('ops@dlt.co.in', 'dlt1234');
  const unassignedTrip = DLT.trips.listAll().find(t => t.id !== b4Trip.id);
  DLT.admin.assignStaff(b4Trip.id, b4Staff.id, 'Shift ended for the unassigned test');
  DLT.auth.signOut();
  await DLT.auth.signIn('staff@dlt.co.in', 'dlt1234');
  ok('F-11 · unassigned staff cannot use code entry either',
    await threw(() => DLT.boarding.scan(duoV.boardingCode), 'not assigned'));

  /* ---- F-10 the pass we issue can actually be decoded by the scanner ---- */
  ok('F-10 · a QR decoder is available to the boarding console',
    typeof window.jsQR === 'function' || typeof window.BarcodeDetector === 'function',
    typeof window.BarcodeDetector === 'function' ? 'native BarcodeDetector present' : 'jsQR fallback in use');
  if (typeof window.jsQR === 'function') {
    const roundTrip = (token, scale) => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = scale;
      DLTQR.draw(cv, token, {});
      const g = cv.getContext('2d');
      const img = g.getImageData(0, 0, cv.width, cv.height);
      const found = window.jsQR(img.data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
      return found ? found.data : null;
    };
    const liveToken = null;
    const anyPass = rawDb().passes.find(p => p.status === 'VALID');
    ok('F-10 · a rendered boarding pass QR decodes back to exactly its token',
      roundTrip(anyPass.qrToken, 320) === anyPass.qrToken, anyPass.qrToken);
    ok('F-10 · it still decodes at the smaller size shown on a phone screen',
      roundTrip(anyPass.qrToken, 176) === anyPass.qrToken);
    ok('F-10 · the decoder returns the token unchanged, adding no interpretation',
      typeof roundTrip(anyPass.qrToken, 320) === 'string');
  }

  /* ---- rate limiting (§7.1) ---- */
  DLT.auth.signOut();
  for (let i = 0; i < 5; i++) { try { await DLT.auth.signIn('diya@woxsen.edu.in', 'nope'); } catch (e) {} }
  ok('repeated failures are rate limited',
    await threw(() => DLT.auth.signIn('diya@woxsen.edu.in', 'dlt1234'), 'too many attempts'));

  out.innerHTML += '\n<span class="' + (fail ? 'fail' : 'pass') + '">' +
    pass + ' passed, ' + fail + ' failed</span>\n';
  document.title = fail ? fail + ' FAILING' : pass + ' passing';
  window.__results = { pass, fail };
})().catch(e => {
  out.innerHTML += '\n<span class="fail">HARNESS ERROR: ' + (e && e.stack || e) + '</span>';
  window.__results = { pass, fail, error: String(e && e.message || e) };
});
</script>
</body>
</html>
